<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airport Satisfaction Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

  <!-- ── Header ───────────────────────────────────────────── -->
  <header>
    <div class="header-left">
      <span class="logo">✈</span>
      <div>
        <h1>Passenger Satisfaction</h1>
        <span class="subtitle">Real-time Emotion Analytics</span>
      </div>
    </div>
    <div class="header-right">
      <div class="status-dot" id="connectionDot"></div>
      <span id="connectionLabel">Connecting...</span>
      <span class="last-update" id="lastUpdate"></span>
    </div>
  </header>

  <main>

    <!-- ── Section 1: Live ──────────────────────────────────── -->
    <section class="section-title">
      <h2>📡 Live — Stare Curentă</h2>
      <p>Actualizat la fiecare 5 secunde</p>
    </section>

    <div class="live-grid" id="liveGrid">
      <!-- Cards injected by JS -->
    </div>

    <!-- ── Heatmap ──────────────────────────────────────────── -->
    <section class="section-title">
      <h2>🗺️ Heatmap Terminal</h2>
      <p>Locația camerelor de supraveghere</p>
    </section>

    <div class="heatmap-container">
      <svg id="airportSvg" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
        <!-- Terminal outline -->
        <rect x="20" y="20" width="760" height="360" rx="18" ry="18"
              fill="#1a1f2e" stroke="#2e4a7a" stroke-width="2"/>
        <!-- Main hall -->
        <rect x="60" y="60" width="680" height="280" rx="10" ry="10"
              fill="#141824" stroke="#2e4a7a" stroke-width="1" stroke-dasharray="6,4"/>
        <!-- Labels -->
        <text x="400" y="50" text-anchor="middle" fill="#4a6fa5" font-size="13" font-family="Arial">
          TERMINAL A
        </text>
        <!-- Runway decoration -->
        <line x1="20" y1="380" x2="780" y2="380" stroke="#2e4a7a" stroke-width="1" stroke-dasharray="20,10"/>

        <!-- Camera markers — positioned in SVG, data updated by JS -->
        <!-- CAM_01 Check-In -->
        <g id="marker-CAM_01" class="cam-marker" transform="translate(130,200)">
          <circle r="28" fill="#1a1f2e" stroke="#2e4a7a" stroke-width="2"/>
          <circle r="22" fill="#333" class="cam-circle" id="circle-CAM_01"/>
          <text y="5" text-anchor="middle" fill="white" font-size="9" font-family="Arial" font-weight="bold">CHECK-IN</text>
          <text y="-35" text-anchor="middle" fill="#8899bb" font-size="10" font-family="Arial" id="label-CAM_01">--</text>
        </g>

        <!-- CAM_02 Security -->
        <g id="marker-CAM_02" class="cam-marker" transform="translate(290,180)">
          <circle r="28" fill="#1a1f2e" stroke="#2e4a7a" stroke-width="2"/>
          <circle r="22" fill="#333" class="cam-circle" id="circle-CAM_02"/>
          <text y="5" text-anchor="middle" fill="white" font-size="9" font-family="Arial" font-weight="bold">SECURITY</text>
          <text y="-35" text-anchor="middle" fill="#8899bb" font-size="10" font-family="Arial" id="label-CAM_02">--</text>
        </g>

        <!-- CAM_03 Lounge -->
        <g id="marker-CAM_03" class="cam-marker" transform="translate(490,220)">
          <circle r="28" fill="#1a1f2e" stroke="#2e4a7a" stroke-width="2"/>
          <circle r="22" fill="#333" class="cam-circle" id="circle-CAM_03"/>
          <text y="5" text-anchor="middle" fill="white" font-size="9" font-family="Arial" font-weight="bold">LOUNGE</text>
          <text y="-35" text-anchor="middle" fill="#8899bb" font-size="10" font-family="Arial" id="label-CAM_03">--</text>
        </g>

        <!-- CAM_04 Departure Gate -->
        <g id="marker-CAM_04" class="cam-marker" transform="translate(660,195)">
          <circle r="28" fill="#1a1f2e" stroke="#2e4a7a" stroke-width="2"/>
          <circle r="22" fill="#333" class="cam-circle" id="circle-CAM_04"/>
          <text y="5" text-anchor="middle" fill="white" font-size="9" font-family="Arial" font-weight="bold">GATE</text>
          <text y="-35" text-anchor="middle" fill="#8899bb" font-size="10" font-family="Arial" id="label-CAM_04">--</text>
        </g>

        <!-- Legend -->
        <g transform="translate(30,345)">
          <circle cx="8"  cy="0" r="6" fill="#22c55e"/>
          <text x="18" y="4" fill="#8899bb" font-size="10" font-family="Arial">Satisfăcut</text>
          <circle cx="100" cy="0" r="6" fill="#f59e0b"/>
          <text x="110" y="4" fill="#8899bb" font-size="10" font-family="Arial">Neutru</text>
          <circle cx="180" cy="0" r="6" fill="#ef4444"/>
          <text x="190" y="4" fill="#8899bb" font-size="10" font-family="Arial">Supărat</text>
        </g>
      </svg>

      <!-- Tooltip -->
      <div class="tooltip" id="tooltip"></div>
    </div>

    <!-- ── Section 2: History ───────────────────────────────── -->
    <section class="section-title history-header">
      <div>
        <h2>📈 Evoluție Istorică</h2>
        <p>Medie agregată la 15 minute</p>
      </div>
      <div class="history-controls">
        <select id="camSelect">
          <option value="">Toate camerele (medie)</option>
          <option value="CAM_01">Check-In</option>
          <option value="CAM_02">Security</option>
          <option value="CAM_03">Lounge</option>
          <option value="CAM_04">Departure Gate</option>
        </select>
        <select id="rangeSelect">
          <option value="1">Ultima 1 oră</option>
          <option value="6">Ultimele 6 ore</option>
          <option value="24" selected>Ultimele 24 ore</option>
        </select>
      </div>
    </section>

    <div class="chart-container">
      <canvas id="historyChart"></canvas>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
